<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Старый Варчун — Онлайн Плеер</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      background: #0a0a0f;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    #loading-screen {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: #0a0a0f;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 10;
      transition: opacity 0.3s ease;
    }
    .spinner {
      width: 44px;
      height: 44px;
      border: 3px solid rgba(255, 255, 255, 0.1);
      border-top-color: #00F2FE;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 16px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .loading-title {
      font-size: 16px;
      font-weight: 600;
      color: #e0e0e0;
      margin-bottom: 6px;
      text-align: center;
      padding: 0 16px;
    }
    .loading-sub {
      font-size: 13px;
      color: #888;
    }
    .player-container {
      width: 100%;
      height: 100%;
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
      position: relative;
    }
    #player-frame {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
      background: #000;
    }
    /* Для AniLibria и чистых 16:9 плееров в вертикальном (портретном) режиме на мобильных */
    body.is-anilibria #player-frame {
      width: 100vw;
      height: 56.25vw; /* идеальная 16:9 пропорция без обрезки по бокам */
      max-height: 100vh;
    }
    @media (orientation: landscape) {
      body.is-anilibria #player-frame {
        width: 100vw;
        height: 100vh;
      }
    }
    /* Floating top control bar */
    .server-bar {
      position: absolute;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 20;
      background: rgba(12, 12, 18, 0.88);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 24px;
      padding: 4px 10px;
      display: flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 6px 24px rgba(0, 0, 0, 0.65);
      transition: opacity 0.3s cubic-bezier(0.16, 1, 0.3, 1), transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      max-width: 96%;
    }
    .server-info {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      font-weight: 600;
      color: #e0e0e0;
      max-width: 110px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      padding: 0 4px;
    }
    .pulse-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #00F2FE;
      box-shadow: 0 0 8px #00F2FE;
      flex-shrink: 0;
    }
    .ctrl-btn {
      background: linear-gradient(135deg, rgba(0, 242, 254, 0.22), rgba(0, 114, 255, 0.22));
      border: 1px solid rgba(0, 242, 254, 0.45);
      color: #fff;
      font-size: 11px;
      font-weight: 600;
      padding: 4px 9px;
      border-radius: 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 3px;
      transition: all 0.2s ease;
      -webkit-tap-highlight-color: transparent;
      white-space: nowrap;
    }
    .ctrl-btn:hover {
      background: linear-gradient(135deg, rgba(0, 242, 254, 0.35), rgba(0, 114, 255, 0.35));
      border-color: #00F2FE;
    }
    .ctrl-btn:active {
      transform: scale(0.93);
    }
    .toast {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: rgba(14, 14, 20, 0.92);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(0, 242, 254, 0.4);
      color: #fff;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 12px;
      opacity: 0;
      pointer-events: none;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      z-index: 30;
      white-space: nowrap;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.5);
    }
    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
    .error-box {
      display: none;
      text-align: center;
      padding: 24px;
    }
    .error-box h3 { color: #ff5252; margin-bottom: 8px; }
  </style>
</head>
<body>
  <div id="loading-screen">
    <div class="spinner"></div>
    <div class="loading-title" id="player-title">Загрузка плеера...</div>
    <div class="loading-sub" id="player-sub">Старый Варчун настраивает видеопоток 🍿</div>
    <div class="error-box" id="error-box">
      <h3>Ошибка загрузки</h3>
      <p id="error-msg"></p>
    </div>
  </div>

  <!-- Плавающая панель управления: смены сервера, полного экрана и открытия в браузере для ПК -->
  <div id="server-bar" class="server-bar" style="display: none;">
    <div class="server-info">
      <span class="pulse-dot"></span>
      <span id="current-server-name">Основной</span>
    </div>
    <button id="btn-next-server" class="ctrl-btn" type="button" title="Переключить озвучку или сервер">
      <span>⚡ Резерв</span>
    </button>
    <button id="btn-fullscreen" class="ctrl-btn" type="button" title="Развернуть во весь экран">
      <span>⛶ Экран</span>
    </button>
    <button id="btn-browser" class="ctrl-btn" type="button" title="Открыть во внешнем браузере (для ПК)">
      <span>🌐 ПК</span>
    </button>
  </div>

  <div id="toast" class="toast"></div>

  <div class="player-container">
    <iframe 
      id="player-frame" 
      sandbox="allow-scripts allow-same-origin allow-fullscreen allow-forms allow-popups allow-popups-to-escape-sandbox"
      allow="autoplay; fullscreen; encrypted-media; picture-in-picture" 
      allowfullscreen="true" 
      webkitallowfullscreen="true" 
      mozallowfullscreen="true">
    </iframe>
  </div>

  <script>
    (function() {
      if (window.Telegram && window.Telegram.WebApp) {
        window.Telegram.WebApp.ready();
        window.Telegram.WebApp.expand();
        try {
          window.Telegram.WebApp.setHeaderColor('#0a0a0f');
          window.Telegram.WebApp.setBackgroundColor('#0a0a0f');
        } catch(e) {}
      }

      function decodeBase64UrlSafe(str) {
        if (!str) return null;
        try {
          let base64 = str.replace(/-/g, '+').replace(/_/g, '/');
          while (base64.length % 4) {
            base64 += '=';
          }
          const binary = atob(base64);
          const bytes = new Uint8Array(binary.length);
          for (let i = 0; i < binary.length; i++) {
            bytes[i] = binary.charCodeAt(i);
          }
          return new TextDecoder().decode(bytes);
        } catch(e) {
          console.warn('Decode error:', e);
          return null;
        }
      }

      const params = new URLSearchParams(window.location.search);

      // Telegram Mini App Direct Link support via startapp / start_param
      let startParam = null;
      try {
        if (window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.initDataUnsafe && window.Telegram.WebApp.initDataUnsafe.start_param) {
          startParam = window.Telegram.WebApp.initDataUnsafe.start_param;
        }
      } catch(e) {}

      if (!startParam) {
        startParam = params.get('tgWebAppStartParam') || params.get('startapp') || params.get('start_param');
      }

      let mainStreamUrl = null;
      let title = null;
      let ep = null;
      let rawAlts = null;

      if (startParam) {
        try {
          const jsonStr = decodeBase64UrlSafe(startParam);
          if (jsonStr) {
            const data = JSON.parse(jsonStr);
            mainStreamUrl = data.u || null;
            title = data.t || null;
            ep = data.e || null;
            rawAlts = data.a || null;
          }
        } catch(e) {
          console.warn('start_param unpack error:', e);
        }
      }

      // Fallback: direct query parameters
      if (!mainStreamUrl) {
        const b64Url = params.get('play');
        if (b64Url) {
          try {
            mainStreamUrl = atob(b64Url);
          } catch(e) {}
        }
      }
      if (!title) title = params.get('t');
      if (!ep) ep = params.get('ep');
      if (!rawAlts) {
        const b64Alts = params.get('alts');
        if (b64Alts) {
          try {
            const rawDecoded = atob(b64Alts);
            rawAlts = JSON.parse(decodeURIComponent(escape(rawDecoded)));
          } catch(e) {}
        }
      }

      if (title) {
        const epSuffix = ep ? ' (Серия ' + ep + ')' : '';
        document.getElementById('player-title').textContent = title + epSuffix;
        document.title = 'Старый Варчун — Онлайн Плеер';
      }

      const frame = document.getElementById('player-frame');
      const loader = document.getElementById('loading-screen');
      const errBox = document.getElementById('error-box');
      const serverBar = document.getElementById('server-bar');
      const serverNameEl = document.getElementById('current-server-name');
      const nextBtn = document.getElementById('btn-next-server');
      const toastEl = document.getElementById('toast');

      function showToast(msg) {
        toastEl.textContent = msg;
        toastEl.classList.add('show');
        setTimeout(() => toastEl.classList.remove('show'), 2500);
      }

      if (!mainStreamUrl) {
        loader.querySelector('.spinner').style.display = 'none';
        errBox.style.display = 'block';
        document.getElementById('error-msg').textContent = 'Поток не найден. Перезапустите выбор тайтла в чате бота.';
        return;
      }

      // Список всех серверов/озвучек
      const allStreams = [];
      allStreams.push({ name: 'Основной', url: mainStreamUrl });

      if (Array.isArray(rawAlts)) {
        rawAlts.forEach(a => {
          if (!a) return;
          const u = a.url || a.u;
          const n = a.name || a.n || a.provider || 'Резерв';
          if (u && !allStreams.some(s => s.url === u)) {
            allStreams.push({ name: n, url: u });
          }
        });
      }

      let currentIdx = 0;

      function loadStream(idx, isManualSwitch) {
        if (!allStreams[idx]) return;
        const s = allStreams[idx];

        if (isManualSwitch) {
          loader.style.display = 'flex';
          loader.style.opacity = '1';
        }

        if (s.url.includes('anilibria.tv') || s.url.includes('iframe.php')) {
          document.body.classList.add('is-anilibria');
        } else {
          document.body.classList.remove('is-anilibria');
        }

        frame.src = s.url;
        serverNameEl.textContent = s.name;

        if (isManualSwitch) {
          showToast('⚡ Сервер переключен: ' + s.name);
        }

        frame.onload = function() {
          setTimeout(function() {
            loader.style.opacity = '0';
            setTimeout(function() { loader.style.display = 'none'; }, 300);
          }, 400);
        };
      }

      // Настройка панели управления
      serverBar.style.display = 'flex';

      if (allStreams.length > 1) {
        nextBtn.style.display = 'flex';
        nextBtn.onclick = function() {
          currentIdx = (currentIdx + 1) % allStreams.length;
          loadStream(currentIdx, true);
        };
      } else {
        nextBtn.style.display = 'none';
      }

      // Кнопка: Полноэкранный режим
      const fsBtn = document.getElementById('btn-fullscreen');
      function updateFsBtn() {
        const isFs = !!(document.fullscreenElement || document.webkitFullscreenElement || document.mozFullScreenElement || document.msFullscreenElement);
        if (fsBtn) {
          fsBtn.innerHTML = isFs ? '<span>🗗 Окно</span>' : '<span>⛶ Экран</span>';
        }
      }
      document.addEventListener('fullscreenchange', updateFsBtn);
      document.addEventListener('webkitfullscreenchange', updateFsBtn);

      if (fsBtn) {
        fsBtn.onclick = function() {
          if (window.Telegram && window.Telegram.WebApp) {
            try { window.Telegram.WebApp.expand(); } catch(e) {}
          }
          const isFs = !!(document.fullscreenElement || document.webkitFullscreenElement || document.mozFullScreenElement || document.msFullscreenElement);
          const elem = document.documentElement;
          if (!isFs) {
            if (elem.requestFullscreen) {
              elem.requestFullscreen().catch(() => {});
            } else if (elem.webkitRequestFullscreen) {
              elem.webkitRequestFullscreen();
            } else if (elem.mozRequestFullScreen) {
              elem.mozRequestFullScreen();
            } else if (elem.msRequestFullscreen) {
              elem.msRequestFullscreen();
            }
            showToast('⛶ Полноэкранный режим');
          } else {
            if (document.exitFullscreen) {
              document.exitFullscreen().catch(() => {});
            } else if (document.webkitExitFullscreen) {
              document.webkitExitFullscreen();
            } else if (document.mozCancelFullScreen) {
              document.mozCancelFullScreen();
            } else if (document.msExitFullscreen) {
              document.msExitFullscreen();
            }
            showToast('🗗 Оконный режим');
          }
          updateFsBtn();
        };
      }

      // Кнопка: Открыть в браузере (для ПК и внешних плееров)
      const browserBtn = document.getElementById('btn-browser');
      if (browserBtn) {
        browserBtn.onclick = function() {
          const s = allStreams[currentIdx];
          if (!s || !s.url) return;
          if (window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.openLink) {
            try {
              window.Telegram.WebApp.openLink(s.url);
              showToast('🌐 Открыто в браузере');
              return;
            } catch(e) {}
          }
          window.open(s.url, '_blank');
          showToast('🌐 Открыто во вкладке');
        };
      }

      // Плавное затухание панели, чтобы не мешать просмотру
      let hideBarTimer = null;
      function kickBarTimer() {
        serverBar.style.opacity = '1';
        clearTimeout(hideBarTimer);
        hideBarTimer = setTimeout(function() {
          serverBar.style.opacity = '0.35';
        }, 4000);
      }
      serverBar.addEventListener('mouseenter', function() { serverBar.style.opacity = '1'; clearTimeout(hideBarTimer); });
      document.body.addEventListener('mousemove', kickBarTimer);
      document.body.addEventListener('touchstart', kickBarTimer);
      kickBarTimer();

      loadStream(0, false);
    })();
  </script>
</body>
</html>
